version: "2"

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus the
  # linters that enforce a specific rule in CLAUDE.md.
  enable:
    - depguard # §Architecture: infra must not import domain
    - errname # §Guiding principles: sentinels are named Err…
    - errorlint # §Guiding principles: wrapping verb, compare with errors.Is
    - exhaustive # §Guiding principles: branch exhaustively on typed constants
    - forbidigo # §Logging conventions and testing skill: banned call sites
    - funlen # §Guiding principles: the ~40 LOC ceiling
    - gochecknoglobals # §Guiding principles: no mutable globals, Err… excepted
    - gochecksumtype # §Guiding principles: same as exhaustive, sealed interfaces
    - lll # §Guiding principles: the 80-column ceiling
    - misspell # spelling, in comments and strings alike
    - nakedret # §Guiding principles: no naked returns
    - revive # §Guiding principles: doc comments, ctx first
    - sloglint # §Logging conventions: structured key/value form
    - thelper # testing skill: t.Helper() in shared assertion helpers
    - usetesting # testing skill: t.TempDir() over os.MkdirTemp
    - wsl_v5 # §Guiding principles: let code breathe, defaults match the rule

  settings:
    depguard:
      rules:
        imperative-shell:
          files:
            - "**/internal/infra/**"
          deny:
            - pkg: github.com/dragonwasrobot/xdg-housekeeper/internal/domain
              desc: the imperative shell must not import the pure core

    errcheck:
      # Never `_ = err`; a discarded error is still an unhandled one.
      check-blank: true

    exhaustive:
      # A default clause must not excuse missing cases: adding a variant should
      # break every switch that ignores it.
      default-signifies-exhaustive: false

    forbidigo:
      # Resolve the call's package by type, so a local named `log` is not
      # mistaken for the stdlib one.
      analyze-types: true
      forbid:
        - pattern: ^log\.[A-Z].*$
          pkg: ^log$
          msg: use log/slog for diagnostics
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to os.Stdout or os.Stderr explicitly
        - pattern: ^reflect\.DeepEqual$
          msg: diff whole values with cmp.Diff, which shows which field moved

    funlen:
      # The soft ceiling from §Guiding principles, made hard. Lines only:
      # statement count is a different measure and wants a different threshold.
      lines: 40
      statements: -1
      ignore-comments: true

    gochecksumtype:
      # Same policy for sealed interfaces. Note the check only applies to an
      # interface carrying the //sumtype:decl directive.
      default-signifies-exhaustive: false

    lll:
      # The same 80 the Markdown checker holds prose to. A tab counts as one
      # character; raise tab-width if the code is read at a wider setting.
      line-length: 80
      tab-width: 1

    nakedret:
      # Any naked return, in a function of any length.
      max-func-lines: 0

    revive:
      rules:
        - name: context-as-argument
        - name: exported
        - name: package-comments

    sloglint:
      # A constant message, then the dynamic values as key/value attributes.
      kv-only: true
      static-msg: true

  exclusions:
    rules:
      # A table-driven test is mostly rows; length there is not complexity.
      - path: _test\.go
        linters:
          - funlen

      # A test's name is its sentence, and a func declaration cannot wrap
      # without mangling it. Test bodies stay held to the limit.
      - path: _test\.go
        source: ^func Test
        linters:
          - lll

issues:
  # Every finding on a line, not just the first; the default hides the second
  # until the first is fixed.
  uniq-by-line: false

formatters:
  enable:
    - gofmt

[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
vale = "3.20.0"

[tasks.vet]
description = "Report suspicious constructs the compiler accepts"
run = 'go vet ./...'

[tasks.lint]
description = "Enforce the CLAUDE.md rules a linter can catch"
run = 'golangci-lint run' # also runs gofmt as one of its linters

[tasks.build]
description = "Compile every package"
run = 'go build ./...'

[tasks.test]
description = "Run the test suite"
run = 'go test ./...'

[tasks.doc-width]
description = "Hold Markdown prose to 80 columns"
run = 'git ls-files -z "*.md" | xargs -0 ./scripts/check-doc-width'

# Only Vale errors cause a non-zero exit, allows warnings to pass verification.
[tasks.prose]
description = "Hold prose and doc comments to the domain language"
run = 'git ls-files -z "*.md" "*.go" | xargs -0 vale'

# A `run` list is sequential and stops at the first failure.
[tasks.verify]
description = "Every check a change must pass"
run = [
  'mise run vet',
  'mise run lint',
  'mise run build',
  'mise run test',
  'mise run doc-width',
  'mise run prose',
]

# Lints spelling, catches meta commentary and enforces domain vocabulary.

StylesPath = styles

Vocab = xdg

# Markdown prose and Go comments both carry the domain vocabulary, so both are
# linted. Vale never reads a string literal, so Ginkgo spec descriptions stay
# out of reach.
#
# `Vale.Terms` is off because it causes conflicts in files containing both `xdg`
# (the package) and `XDG` (the standard) due to casing. The cost is that nothing
# holds `Gomega` to its proper capitalization, since `Vale.Spelling` matches the
# list case-insensitively.
#
# A rule toggle is inherited by later matching section; `BasedOnStyles` breaks
# the inheritance by replacing rather than merging.

[*.md]
BasedOnStyles = Vale, Housekeeper
Vale.Terms = NO

# A plan file names retired spellings by design, so `Housekeeper` never loads
# on one. `Vocab` still does.
[PLAN*.md]
BasedOnStyles = Vale

# `Housekeeper.Terms` may produce false positives on sections that define a term
# or anti-pattern in terms of a retired spelling, in which case `TokenIgnores`
# may exempts the offending phrase:
[CONTEXT.md]
TokenIgnores = destination path

[CLAUDE.md]
TokenIgnores = destination path

# Offending phrases should not exist in go comments as excemptions are only for
# providing reasoning in surrounding documentation.
[*.go]
BasedOnStyles = Vale, Housekeeper
Vale.Terms = NO
